[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-studio"
version = "1.0.0"
description = "On-Device Neural Voice Cloning & Reference Catalog System (IndicF5 & ZipVoice)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchaudio",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "safetensors>=0.4.0",
    "vocos>=0.1.0",
    "sherpa-onnx>=1.10.0",
    "onnxruntime>=1.16.0",
    "questionary>=2.1.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
voice-studio = "voice_studio.cli.app:main"
voice-clone = "clone:main"
voice-batch = "batch:main"

[tool.setuptools.packages.find]
where = ["src"]
